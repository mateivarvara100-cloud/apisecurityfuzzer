[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apifuzz"
version = "0.1.0"
description = "OpenAPI-driven security scanner for authorized staging APIs (OWASP API Top 10)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prance>=23.6",
    "openapi-spec-validator>=0.7",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apifuzz = "apifuzz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apifuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
