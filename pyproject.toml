[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apifuzz"
version = "0.3.1"
description = "OpenAPI-driven security scanner for authorized staging APIs (OWASP API Top 10)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mateivarvara100-cloud" }]
keywords = ["openapi", "swagger", "security", "owasp", "api", "bola", "idor", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "prance>=23.6",
    "openapi-spec-validator>=0.7",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/mateivarvara100-cloud/apisecurityfuzzer"
Issues = "https://github.com/mateivarvara100-cloud/apisecurityfuzzer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
apifuzz = "apifuzz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apifuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["prance", "prance.*"]  # prance ships no type information
ignore_missing_imports = true

[tool.coverage.run]
source = ["apifuzz"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90  # the suite sits well above this; a drop below it means untested code was added

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: style errors, F: real mistakes (unused names, undefined names), I: import order,
# B: likely bugs. Long lines are left to judgement (E501 off): some tables read better wide.
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer reads its options from function-call defaults; that is how the library is meant to be used.
"src/apifuzz/cli.py" = ["B008"]
