[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The web backend for the hosted demo (Phase 4). It runs the apifuzz engine itself, the package in
# the repository root, so a scan from the browser finds exactly what the CLI finds.
[project]
name = "apifuzz-web"
version = "0.1.0"
description = "Web backend for the apifuzz hosted demo: signed-in scans of allowlisted targets."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "apifuzz",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

# Local development uses the engine from this repository, not the copy on PyPI.
[tool.uv.sources]
apifuzz = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/apifuzz_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Read the engine from its source: the installed package has no py.typed marker.
mypy_path = "../src"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["prance", "prance.*"]  # the engine's spec parser ships no type information
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads dependencies from function-call defaults (Depends, Header); that is how it is used.
"src/apifuzz_web/app.py" = ["B008"]
