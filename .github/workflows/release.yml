# Publish apifuzz to PyPI when a GitHub Release is published, using Trusted Publishing (OIDC):
# no API token is stored anywhere — PyPI verifies the release came from this repo's workflow.
# Setup (one time) is in the README's "Releasing" note. The published version is the one in
# pyproject.toml, not the git tag, so bump it before cutting each release.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build  # writes the sdist and wheel to dist/
      - run: pipx run twine check dist/*  # fails if the metadata or README would be rejected
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment registered with the PyPI trusted publisher.
    environment: pypi
    permissions:
      id-token: write  # lets the job mint the OIDC token PyPI checks; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1  # uploads everything in dist/ via OIDC
