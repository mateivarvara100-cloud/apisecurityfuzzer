# Continuous integration for apifuzz itself. (Phase 3 is about other people running the scanner
# in their CI; this is the project's own quality gate.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest --cov  # fails under 90% coverage (see pyproject.toml)

  demo:
    # Boot the real VulnShop container and scan it end to end, so the Docker path and the
    # ground-truth demo are exercised, not just the in-process tests.
    name: demo scan (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # lets this job upload the lab's SARIF report to code scanning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Boot VulnShop and scan it
        run: |
          docker compose up -d --build --wait
          apifuzz verify-docker http://localhost:8000
          APIFUZZ_USER_A=alice APIFUZZ_PASSWORD_A=alice \
          APIFUZZ_USER_B=bob APIFUZZ_PASSWORD_B=bob \
          apifuzz scan http://localhost:8000/openapi.json \
            --i-have-authorization --require-docker \
            --json-out report.json --html report.html --fail-on never
      - name: Scan again from the spec file, for SARIF
        # SARIF points each finding at a line of the spec, so this scan reads the spec from the
        # repository (lab/openapi.json) instead of downloading it: the lines then exist on GitHub.
        run: |
          APIFUZZ_USER_A=alice APIFUZZ_PASSWORD_A=alice           APIFUZZ_USER_B=bob APIFUZZ_PASSWORD_B=bob           apifuzz scan lab/openapi.json --base-url http://localhost:8000             --i-have-authorization --require-docker             --sarif report.sarif --fail-on never
      - name: Check the planted BOLA was found
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("report.json"))
          found = {(f["check"], f["endpoint"]) for f in report["findings"]}
          assert ("bola", "GET /orders/{id}") in found, found
          sarif = json.load(open("report.sarif"))
          assert sarif["version"] == "2.1.0" and len(sarif["runs"][0]["results"]) == len(report["findings"])
          assert ("auth-required", "GET /users/{id}") in found, found
          assert ("injection", "GET /search") in found, found
          assert ("injection", "POST /login") in found, found
          assert ("injection", "GET /catalog/{name}") in found, found  # a path parameter
          assert ("injection", "GET /stock") in found, found  # a header
          print("demo scan OK:", report["requests_sent"], "requests,", len(report["findings"]), "findings")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report
          path: |
            report.json
            report.sarif
            report.html
      - name: Upload the lab's findings to code scanning
        # The lab's flaws are planted on purpose, so these alerts are expected: they show what the
        # scanner's SARIF looks like on GitHub. Pushes only: a pull request from a fork has no
        # permission to upload.
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report.sarif
          category: vulnshop-lab
      - if: always()
        run: docker compose down
